<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de arquitectura</title>
<!-- Sin CDN ni dependencias: todos los estilos están acá, funciona offline con doble clic. -->
<style>
:root{--bg:#0f1319;--panel:#171c24;--panel2:#1f2631;--borde:#2f3a49;--txt:#eef2f7;--sub:#b3bfce;--acento:#7db1ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--borde)}
h1{margin:0 0 6px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--borde);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--sub)}
.chip b{color:var(--txt)}
#aviso{display:none;margin-top:8px;padding:8px 12px;border-radius:6px;background:#4a3a0a;border:1px solid #fbbc04;color:#ffe9a8}
.barra{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--borde)}
.barra fieldset{border:1px solid var(--borde);border-radius:6px;margin:0;padding:2px 8px 4px;display:flex;flex-wrap:wrap;gap:2px 10px}
.barra legend{font-size:11px;color:var(--sub);padding:0 4px}
.barra label{font-size:12px;color:var(--txt);display:inline-flex;gap:4px;align-items:center;cursor:pointer}
input[type=search]{background:var(--bg);color:var(--txt);border:1px solid var(--borde);border-radius:6px;padding:6px 10px;width:260px;font:inherit}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--borde);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acento)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{flex:1;display:flex;min-height:0}
#lienzo{flex:1;overflow:auto;position:relative}
aside{width:390px;max-width:45vw;border-left:1px solid var(--borde);background:var(--panel);display:flex;flex-direction:column;min-height:0}
[role=tablist]{display:flex;border-bottom:1px solid var(--borde)}
[role=tab]{flex:1;border:0;border-radius:0;background:transparent;padding:9px 6px;color:var(--sub);border-bottom:2px solid transparent}
[role=tab][aria-selected=true]{color:var(--txt);border-bottom-color:var(--acento)}
.cuerpo{padding:12px 14px;overflow:auto;flex:1}
.cuerpo h2{margin:0 0 4px;font-size:16px}
.cuerpo h3{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)}
.cuerpo p{margin:4px 0}
.cuerpo ul{margin:4px 0;padding-left:18px}
.cuerpo code{background:var(--bg);border:1px solid var(--borde);border-radius:4px;padding:0 4px;font-size:12px;word-break:break-all}
.etq{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;margin-right:4px;border:1px solid var(--borde);color:var(--sub)}
.etq.warn{border-color:#fbbc04;color:#ffe9a8}
.item{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 8px}
.item small{color:var(--sub);display:block}
mark{background:#fbbc04;color:#111;border-radius:2px}
.paso{display:flex;gap:8px;margin:8px 0;align-items:flex-start;cursor:pointer}
.paso .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acento);color:#0b1020;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.vacio{color:var(--sub);font-style:italic}
/* SVG */
svg text{font-family:inherit}
.banda{fill:#141a22}
.banda.par{fill:#111720}
.capa-t{fill:#cfd8e3;font-size:13px;font-weight:700}
.capa-d{fill:#8f9bab;font-size:11px}
.nodo{cursor:pointer;transition:opacity .15s}
.nodo .caja{fill:#1d2530;stroke-width:1.5}
.nodo:hover .caja{fill:#26313f}
.nodo:focus-visible{outline:none}
.nodo:focus-visible .caja{stroke:#fff;stroke-width:3}
.nodo .nom{fill:#f4f7fb;font-size:12px;font-weight:700}
.nodo .sub{fill:#aab6c6;font-size:10.5px}
.nodo.sel .caja{stroke:#fff;stroke-width:3}
.nodo.hit .caja{stroke:#fbbc04;stroke-width:3}
.nodo.obsoleto .caja{stroke-dasharray:5 4}
.nodo.obsoleto .nom,.nodo.obsoleto .sub{opacity:.6}
.apagado{opacity:.16}
.oculto{display:none}
.flecha{fill:none;stroke-width:1.4;opacity:.5}
.flecha.apagado{opacity:.05}
.flecha.resalt{stroke-width:2.8;opacity:1}
.etiq{font-size:10.5px;fill:#dfe6ef;paint-order:stroke;stroke:#0f1319;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.etiq.resalt{font-weight:700;fill:#fff}
.flujo-linea{fill:none;stroke-width:3.2}
.insignia rect{stroke:#0b1020;stroke-width:1}
.insignia text{fill:#0b1020;font-size:11px;font-weight:700}
@media (max-width:900px){main{flex-direction:column}aside{width:100%;max-width:none;max-height:45vh;border-left:0;border-top:1px solid var(--borde)}}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Mapa de arquitectura</h1>
  <div class="chips" id="chips" aria-label="Datos del mapa"></div>
  <div id="aviso" role="alert"></div>
</header>
<div class="barra" role="search">
  <input id="q" type="search" placeholder="Buscar nodos, archivos o flujos…" aria-label="Buscar nodos, archivos o flujos">
  <fieldset id="fCapas"><legend>Capas</legend></fieldset>
  <fieldset id="fTipos"><legend>Tipo de flecha</legend></fieldset>
  <label><input type="checkbox" id="etiquetas"> Etiquetas de flechas</label>
  <button id="verTodo" type="button">Ver todo</button>
</div>
<main>
  <div id="lienzo" tabindex="-1"></div>
  <aside>
    <div role="tablist" aria-label="Paneles">
      <button role="tab" id="tab-detalle" aria-selected="true" aria-controls="panel">Detalle</button>
      <button role="tab" id="tab-flujos" aria-selected="false" aria-controls="panel">Flujos</button>
      <button role="tab" id="tab-buscar" aria-selected="false" aria-controls="panel">Resultados</button>
    </div>
    <div class="cuerpo" id="panel" role="tabpanel" aria-live="polite"></div>
  </aside>
</main>

    var sig = capas[i + 1], hh = sig ? sig.y - c.y : ALTO_ULTIMA;
    var g = s("g", { "data-capa": c.id });
    g.appendChild(s("rect", { class: "banda" + (i % 2 ? " par" : ""), x: 0, y: c.y - 6, width: ancho, height: hh }));
    g.appendChild(s("text", { class: "capa-t", x: 14, y: c.y + 12 }, c.nombre));
    if (c.desc) g.appendChild(s("text", { class: "capa-d", x: 14, y: c.y + 26 }, recortar(c.desc, 190)));
    c.g = g; gBandas.appendChild(g);
  });

  nodos.forEach(function (n) {
    var col = COLORES[n.color] || COLORES.gris;
    var etqs = (n.obsoleto ? " (obsoleto)" : "") + (n.revisar ? " (a revisar)" : "");
    var g = s("g", { class: "nodo" + (n.obsoleto ? " obsoleto" : ""), transform: "translate(" + n.px + "," + n.py + ")", tabindex: 0, role: "button",
      "aria-label": n.nombre + ". " + (n.sub || "") + ". Capa " + capaPorId[n.capa].nombre + etqs, "data-id": n.id });
    g.appendChild(s("title", {}, n.nombre + " — " + (n.sub || "")));
    g.appendChild(s("rect", { class: "caja", width: n.w, height: NH, rx: 8, stroke: col }));
    g.appendChild(s("rect", { x: 0, y: 0, width: 6, height: NH, rx: 3, fill: col }));
    g.appendChild(s("text", { class: "nom", x: 16, y: 25 }, recortar(n.nombre, Math.floor((n.w - 26) / 6.5))));
    g.appendChild(s("text", { class: "sub", x: 16, y: 44 }, recortar(n.sub || "", Math.floor((n.w - 26) / 5.4))));
    g.addEventListener("click", function () { seleccionar(n.id); });
    g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); seleccionar(n.id); } });
    n.g = g; gNodos.appendChild(g);
  });

  /* Geometría de flechas: cada extremo se reparte a lo largo del borde para evitar solapes. */
  function lado(a, b) { return Math.abs(a.py - b.py) < 1 ? ["top", "top"] : a.py < b.py ? ["bottom", "top"] : ["top", "bottom"]; }
  var enganches = {};
  aristas.forEach(function (e) {
    var a = porId[e.from], b = porId[e.to]; if (!a || !b) return;
    var l = lado(a, b); e.l = l;
    [[a, l[0], "x1", b], [b, l[1], "x2", a]].forEach(function (q) {
      var k = q[0].id + "|" + q[1]; (enganches[k] = enganches[k] || []).push({ e: e, campo: q[2], otro: q[3].px + q[3].w / 2 });
    });
  });
  Object.keys(enganches).forEach(function (k) {
    var lista = enganches[k], n = porId[k.split("|")[0]];
    lista.sort(function (u, v) { return u.otro - v.otro || u.e.i - v.e.i; });
    lista.forEach(function (it, i) { it.e[it.campo] = n.px + (n.w * (i + 1)) / (lista.length + 1); });
  });
  function trazo(e, desvio) {
    var a = porId[e.from], b = porId[e.to], l = e.l || lado(a, b);
    var x1 = e.x1 != null ? e.x1 : a.px + a.w / 2, x2 = e.x2 != null ? e.x2 : b.px + b.w / 2;
    x1 += desvio || 0; x2 += desvio || 0;
    var y1 = l[0] === "top" ? a.py : a.py + NH, y2 = l[1] === "top" ? b.py : b.py + NH, c1y, c2y;
    if (l[0] === l[1]) { var up = Math.abs(x1 - x2) / 4 + 34; c1y = y1 - up; c2y = y2 - up; }
    else { var dy = Math.abs(y2 - y1) / 2; c1y = y1 + (l[0] === "bottom" ? dy : -dy); c2y = y2 + (l[1] === "top" ? -dy : dy); }
    return { d: "M" + x1 + " " + y1 + " C" + x1 + " " + c1y + " " + x2 + " " + c2y + " " + x2 + " " + y2, mx: (x1 + x2) / 2, my: (y1 + 3 * c1y + 3 * c2y + y2) / 8 };
  }
  aristas.forEach(function (e) {
    if (!porId[e.from] || !porId[e.to]) return;
    var t = trazo(e), tp = TIPOS[e.tipo] || TIPOS.usa;
    var p = s("path", { class: "flecha", d: t.d, stroke: tp.c, "marker-end": "url(#f-" + e.tipo + ")" });
    if (tp.dash) p.setAttribute("stroke-dasharray", tp.dash);
    p.appendChild(s("title", {}, porId[e.from].nombre + " → " + porId[e.to].nombre + ": " + e.label + " (" + e.tipo + ")"));
    var et = s("text", { class: "etiq", x: t.mx, y: t.my, "text-anchor": "middle" }, e.label);
    e.p = p; e.t = et; gAristas.appendChild(p); gEtiq.appendChild(et);
  });
  document.getElementById("lienzo").appendChild(svg);

  /* ---------- búsqueda ---------- */
  function buscar(q) {
    var qn = norm(q), r = { nodos: {}, lista: [] };
    nodos.forEach(function (n) {
      var campos = [["Nodo", n.nombre], ["Sub", n.sub || ""], ["Descripción", n.desc || ""], ["Id", n.id]];
      var enc = campos.filter(function (c) { return norm(c[1]).indexOf(qn) !== -1; })[0];
      if (enc) { r.nodos[n.id] = true; r.lista.push({ tipo: "nodo", id: n.id, titulo: n.nombre, detalle: enc[0] + ": " + recortar(enc[1], 90) }); }
      (n.archivos || []).forEach(function (a) {
        if (norm(a).indexOf(qn) !== -1) { r.nodos[n.id] = true; r.lista.push({ tipo: "archivo", id: n.id, titulo: a, detalle: "en " + n.nombre }); }
      });
    });
    flujos.forEach(function (f) {
      var txt = [f.nombre, f.resumen || ""].concat(f.archivos || []).concat(f.steps.map(function (p) { return p.t + " " + p.d; }));
      if (txt.some(function (t) { return norm(t).indexOf(qn) !== -1; })) {
        r.lista.push({ tipo: "flujo", id: f.id, titulo: f.nombre, detalle: recortar(f.resumen || "", 90) });
      }
    });
    return r;
  }

  /* ---------- aplicar estado ---------- */
  function vecinos(id) {
    var v = {}; v[id] = true;
    aristas.forEach(function (e) { if (e.from === id) v[e.to] = true; if (e.to === id) v[e.from] = true; });
    return v;
  }
  var hits = null;
  function aplicar() {
    var f = estado.flujo ? flujos.filter(function (x) { return x.id === estado.flujo; })[0] : null;
    var enFlujo = f ? f.steps.reduce(function (o, p) { o[p.n] = true; return o; }, {}) : null;
    var vec = estado.sel ? vecinos(estado.sel) : null;
    hits = estado.q ? buscar(estado.q) : null;
    nodos.forEach(function (n) {
      var oculto = !estado.capas[n.capa], dim = false;
      if (enFlujo) dim = !enFlujo[n.id]; else if (vec) dim = !vec[n.id]; else if (hits) dim = !hits.nodos[n.id];
      n.g.classList.toggle("oculto", oculto); n.g.classList.toggle("apagado", dim && !oculto);
      n.g.classList.toggle("sel", estado.sel === n.id);
      n.g.classList.toggle("hit", !!(hits && hits.nodos[n.id]));
    });
    aristas.forEach(function (e) {
      if (!e.p) return;
      var oculto = !estado.tipos[e.tipo] || !estado.capas[porId[e.from].capa] || !estado.capas[porId[e.to].capa];
      var resalt = !!(estado.sel && (e.from === estado.sel || e.to === estado.sel));
      var dim = f ? true : estado.sel ? !resalt : hits ? true : false;
      [e.p, e.t].forEach(function (x) { x.classList.toggle("oculto", oculto); x.classList.toggle("apagado", dim && !oculto); x.classList.toggle("resalt", resalt); });
      e.t.classList.toggle("oculto", oculto || (!estado.etiquetas && !resalt));
    });
    dibujarFlujo(f);
    document.querySelectorAll("#fCapas input").forEach(function (cb) { cb.checked = !!estado.capas[cb.dataset.id]; });
    document.querySelectorAll("#fTipos input").forEach(function (cb) { cb.checked = !!estado.tipos[cb.dataset.id]; });
  }

  function dibujarFlujo(f) {
    while (gFlujo.firstChild) gFlujo.removeChild(gFlujo.firstChild);
    if (!f) return;
    var col = COLORES[f.color] || COLORES.azul, nums = {};
    f.steps.forEach(function (p, i) {
      (nums[p.n] = nums[p.n] || []).push(i + 1);
      var sig = f.steps[i + 1];
      if (sig && sig.n !== p.n && porId[p.n] && porId[sig.n]) {
        var t = trazo({ from: p.n, to: sig.n }, ((i % 3) - 1) * 12);
        gFlujo.appendChild(s("path", { class: "flujo-linea", d: t.d, stroke: col, "marker-end": "url(#fc-" + f.color + ")" }));
      }
    });
    Object.keys(nums).forEach(function (id) {
      var n = porId[id]; if (!n || !estado.capas[n.capa]) return;
      var txt = nums[id].join("·"), w = 14 + txt.length * 7;
      var g = s("g", { class: "insignia", transform: "translate(" + (n.px - 6) + "," + (n.py - 12) + ")" });
      g.appendChild(s("rect", { width: w, height: 20, rx: 10, fill: col }));
      g.appendChild(s("text", { x: w / 2, y: 14, "text-anchor": "middle" }, txt));
      gFlujo.appendChild(g);
    });
  }

  /* ---------- paneles ---------- */
  var panel = document.getElementById("panel");
  function tab(nombre) {
    ["detalle", "flujos", "buscar"].forEach(function (t) { document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === nombre)); });
    panel.setAttribute("aria-labelledby", "tab-" + nombre);
    estado.tab = nombre;
    if (nombre === "detalle") panelDetalle(); else if (nombre === "flujos") panelFlujos(); else panelBuscar();
  }
  ["detalle", "flujos", "buscar"].forEach(function (t) { document.getElementById("tab-" + t).addEventListener("click", function () { tab(t); }); });

  function lista(arr) { var u = h("ul"); arr.forEach(function (t) { u.appendChild(h("li", {}, t)); }); return u; }
  function irA(id) { var n = porId[id]; if (n) { var l = document.getElementById("lienzo"); l.scrollLeft = Math.max(0, n.px - 200); l.scrollTop = Math.max(0, n.py - 160); } }

  function panelDetalle() {
    panel.textContent = "";
    var n = estado.sel ? porId[estado.sel] : null;
    if (!n) { panel.appendChild(h("p", { class: "vacio" }, "Hacé click en un nodo para ver qué hace, qué archivos lo respaldan y con quién se conecta. También podés elegir un flujo en la pestaña Flujos.")); return; }
    var col = COLORES[n.color] || COLORES.gris;
    panel.appendChild(h("h2", { style: "color:" + col }, n.nombre));
    var meta = h("p", {}, h("span", { class: "etq" }, capaPorId[n.capa].nombre), n.auto ? h("span", { class: "etq" }, "detectado automáticamente") : h("span", { class: "etq" }, "curado a mano"));
    if (n.obsoleto) meta.appendChild(h("span", { class: "etq warn" }, "obsoleto: sus archivos ya no existen"));
    if (n.revisar) meta.appendChild(h("span", { class: "etq warn" }, "descripción a revisar"));
    panel.appendChild(meta);
    if (n.sub) panel.appendChild(h("p", { class: "vacio" }, n.sub));
    panel.appendChild(h("p", {}, n.desc));
    if (n.nArchivos != null) panel.appendChild(h("p", { class: "vacio" }, n.nArchivos + " archivos de código · " + n.lineas.toLocaleString("es-AR") + " líneas"));
    if (n.detalle && n.detalle.length) { panel.appendChild(h("h3", {}, "Detalle")); panel.appendChild(lista(n.detalle)); }
    if (n.archivos && n.archivos.length) {
      panel.appendChild(h("h3", {}, "Archivos"));
      var u = h("ul"); n.archivos.forEach(function (a) { u.appendChild(h("li", {}, h("code", {}, a))); }); panel.appendChild(u);
    }
    [["Entradas (quién lo usa)", function (e) { return e.to === n.id; }, "from"], ["Salidas (qué usa)", function (e) { return e.from === n.id; }, "to"]].forEach(function (g) {
      var es = aristas.filter(g[1]);
      panel.appendChild(h("h3", {}, g[0] + " · " + es.length));
      if (!es.length) { panel.appendChild(h("p", { class: "vacio" }, "Ninguna.")); return; }
      es.forEach(function (e) {
        var o = porId[e[g[2]]]; if (!o) return;
        var b = h("button", { class: "item", type: "button" }, (g[2] === "from" ? "← " : "→ ") + o.nombre, h("small", {}, e.label + " · " + e.tipo));
        b.addEventListener("click", function () { seleccionar(o.id); irA(o.id); }); panel.appendChild(b);
      });
    });
    var fl = flujos.filter(function (f) { return f.steps.some(function (p) { return p.n === n.id; }); });
    if (fl.length) {
      panel.appendChild(h("h3", {}, "Aparece en estos flujos"));
      fl.forEach(function (f) { var b = h("button", { class: "item", type: "button" }, f.nombre); b.addEventListener("click", function () { elegirFlujo(f.id); }); panel.appendChild(b); });
    }
  }

  function panelFlujos() {
    panel.textContent = "";
    var f = estado.flujo ? flujos.filter(function (x) { return x.id === estado.flujo; })[0] : null;
    if (!f) {
      panel.appendChild(h("p", { class: "vacio" }, "Elegí un recorrido para verlo paso a paso sobre el mapa."));
      flujos.forEach(function (x) {
        var b = h("button", { class: "item", type: "button", style: "border-left:4px solid " + (COLORES[x.color] || "#888") }, x.nombre, h("small", {}, x.resumen));
        b.addEventListener("click", function () { elegirFlujo(x.id); }); panel.appendChild(b);
      });
      return;
    }
    var volver = h("button", { type: "button" }, "← Todos los flujos");
    volver.addEventListener("click", function () { estado.flujo = null; aplicar(); panelFlujos(); });
    panel.appendChild(volver);
    panel.appendChild(h("h2", { style: "margin-top:10px;color:" + (COLORES[f.color] || "#fff") }, f.nombre));
    panel.appendChild(h("p", {}, f.resumen));
    f.steps.forEach(function (p, i) {
      var d = h("div", { class: "paso", tabindex: 0, role: "button", "aria-label": "Paso " + (i + 1) + ": " + p.t },
        h("span", { class: "num", style: "background:" + (COLORES[f.color] || "#7db1ff") }, String(i + 1)),
        h("div", {}, h("b", {}, p.t), h("div", { class: "vacio", style: "font-style:normal" }, (porId[p.n] ? porId[p.n].nombre : p.n)), h("div", {}, p.d)));
      function go() { irA(p.n); }
      d.addEventListener("click", go); d.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
      panel.appendChild(d);
    });
    if (f.archivos && f.archivos.length) { panel.appendChild(h("h3", {}, "Archivos del flujo")); var u = h("ul"); f.archivos.forEach(function (a) { u.appendChild(h("li", {}, h("code", {}, a))); }); panel.appendChild(u); }
  }

  function panelBuscar() {
    panel.textContent = "";
    if (!estado.q) { panel.appendChild(h("p", { class: "vacio" }, "Escribí en el buscador para encontrar nodos, archivos o flujos.")); return; }
    var r = hits || buscar(estado.q);
    panel.appendChild(h("p", {}, r.lista.length + " resultado" + (r.lista.length === 1 ? "" : "s") + " para “" + estado.q + "”"));
    r.lista.forEach(function (x) {
      var b = h("button", { class: "item", type: "button" }, h("span", { class: "etq" }, x.tipo), resaltar(x.titulo, estado.q), h("small", {}, resaltar(x.detalle, estado.q)));
      b.addEventListener("click", function () { if (x.tipo === "flujo") elegirFlujo(x.id); else { seleccionar(x.id); irA(x.id); } });
      panel.appendChild(b);
    });
  }

  function seleccionar(id) { estado.sel = estado.sel === id ? null : id; estado.flujo = null; aplicar(); tab("detalle"); }
  function elegirFlujo(id) { estado.flujo = id; estado.sel = null; aplicar(); tab("flujos"); var f = flujos.filter(function (x) { return x.id === id; })[0]; if (f && f.steps[0]) irA(f.steps[0].n); }

  /* ---------- eventos globales ---------- */
  var q = document.getElementById("q"), tq = null;
  q.addEventListener("input", function () {
    clearTimeout(tq);
    tq = setTimeout(function () { estado.q = q.value.trim(); aplicar(); if (estado.q) tab("buscar"); else tab(estado.flujo ? "flujos" : "detalle"); }, 120);
  });
  document.getElementById("etiquetas").addEventListener("change", function (ev) { estado.etiquetas = ev.target.checked; aplicar(); });
  document.getElementById("verTodo").addEventListener("click", function () {
    estado.sel = null; estado.flujo = null; estado.q = ""; q.value = ""; estado.etiquetas = false; document.getElementById("etiquetas").checked = false;
    capas.forEach(function (c) { estado.capas[c.id] = true; }); Object.keys(TIPOS).forEach(function (t) { estado.tipos[t] = true; });
    aplicar(); tab("detalle");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { estado.sel = null; estado.flujo = null; aplicar(); tab("detalle"); }
    if (ev.key === "/" && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
  });

  aplicar(); tab("detalle");
})();
</script>
</body>
</html>
